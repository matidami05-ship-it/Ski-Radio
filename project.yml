name: SkiRadio
options:
  bundleIdPrefix: com.ski
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SkiRadio:
    type: application
    platform: iOS
    sources:
      - path: SkiRadio
    settings:
      base:
        PRODUCT_NAME: SkiRadio
        PRODUCT_BUNDLE_IDENTIFIER: com.matidami05.skiradio
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Support/SkiRadio.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
