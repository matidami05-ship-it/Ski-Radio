name: Build iOS

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator (compile check)
        run: |
          xcodebuild -project SkiRadio.xcodeproj -scheme SkiRadio \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          xcodebuild -project SkiRadio.xcodeproj -scheme SkiRadio \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SkiRadio.app Payload/
          zip -qr SkiRadio-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SkiRadio-unsigned-ipa
          path: SkiRadio-unsigned.ipa

      # A Release gives a direct download link that works on a phone.
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest SkiRadio-unsigned.ipa \
            --title "Ski Radio (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Unsigned: install with Sideloadly or AltStore." \
            --latest
