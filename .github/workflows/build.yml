name: Build iOS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for Simulator (compile check)
        run: |
          xcodebuild -project SkiRadio.xcodeproj -scheme SkiRadio \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned IPA
        run: |
          xcodebuild -project SkiRadio.xcodeproj -scheme SkiRadio \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -configuration Release -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SkiRadio.app Payload/
          zip -qr SkiRadio-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SkiRadio-unsigned-ipa
          path: SkiRadio-unsigned.ipa
